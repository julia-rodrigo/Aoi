<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style directions</title>
<style>
  @font-face { font-family: 'Instrument Serif'; src: url('/kit/fonts/InstrumentSerif-Regular.ttf'); }
  @font-face { font-family: 'Instrument Sans'; src: url('/kit/fonts/InstrumentSans.ttf'); font-weight: 400 700; }
  :root {
    --bg: #ffffff; --bg2: #f7f7f4; --fg: #141414; --muted: #6e6e66; --border: #e4e4df; --sep: #ecece7; --card-line: #e9e9e4;
    --accent: #5d7740; --accent-hover: #51693a; --on-accent: #ffffff; --soft: #eef2e6; --on-soft: #3f5229;
    --card: #ffffff; --page: #ffffff; --card-shadow: none; --ring: inset 0 0 0 1px #e2e2dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111210; --bg2: #1a1b17; --fg: #eceae2; --muted: #97978d; --border: rgba(255,255,255,.09); --sep: rgba(255,255,255,.07); --card-line: rgba(255,255,255,.075);
      --accent: #8fa866; --accent-hover: #9db574; --on-accent: #10110e; --soft: rgba(143,168,102,.15); --on-soft: #b9cc95;
      --card: radial-gradient(120% 90% at 0% 0%, #2c2d27 0%, #1f201c 55%, #1a1b17 100%);
      --page: radial-gradient(ellipse 85% 65% at 50% -12%, #2a2b25 0%, #1a1b17 48%, #111210 100%);
      --card-shadow: 0 18px 44px rgba(0,0,0,.42); --ring: inset 0 0 0 1px rgba(255,255,255,.08);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: var(--page); background-color: var(--bg); color: var(--fg); font: 400 .9375rem/1.5 'Instrument Sans', system-ui, sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 32px 24px 64px; }
  .back { color: var(--muted); font-size: .8125rem; text-decoration: none; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  h1 { font: 400 2.8rem/1.05 'Instrument Serif', serif; letter-spacing: -.01em; margin: 0; }
  .guide { color: var(--muted); margin: 10px 0 24px; max-width: 680px; }
  .tabs { display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--bg2); box-shadow: var(--ring); flex-wrap: wrap; }
  .tabs button { font: 500 .875rem 'Instrument Sans', sans-serif; border: 0; border-radius: 999px; padding: 7px 16px; cursor: pointer; background: transparent; color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: var(--soft); color: var(--on-soft); }
  .parent { color: var(--muted); font-size: .8125rem; margin: -8px 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .card { background: var(--card); background-color: var(--bg); border: 1px solid var(--card-line); border-radius: 12px; overflow: hidden; box-shadow: var(--card-shadow); display: flex; flex-direction: column; }
  .card img { display: block; width: 100%; aspect-ratio: 8 / 3; object-fit: cover; cursor: zoom-in; border-bottom: 1px solid var(--sep); }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .head { display: flex; align-items: center; gap: 10px; }
  .num { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 32px; padding: 0 10px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: .875rem; }
  h2 { font: 400 1.5rem/1.1 'Instrument Serif', serif; margin: 0; }
  .blurb { color: var(--muted); margin: 0; font-size: .875rem; flex: 1; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions a { font: 500 .8125rem 'Instrument Sans', sans-serif; text-decoration: none; border-radius: 999px; padding: 6px 14px; color: var(--fg); box-shadow: var(--ring); background: var(--bg2); }
  .actions a.primary { background: var(--accent); color: var(--on-accent); box-shadow: none; }
  .actions a.primary:hover { background: var(--accent-hover); }
  .err { color: #b2452f; font-size: .8125rem; }
  .box { position: fixed; inset: 0; background: rgba(10,10,8,.88); display: none; align-items: center; justify-content: center; padding: 24px; z-index: 5; }
  .box.on { display: flex; }
  .box img { max-width: 100%; max-height: 100%; border-radius: 12px; }
  .box p { position: absolute; top: 14px; left: 0; right: 0; text-align: center; color: #eceae2; margin: 0; font-size: .875rem; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 600px) { h1 { font-size: 2.25rem; } main { padding: 20px 16px 40px; } }
</style>
</head>
<body>
<main>
  <a class="back" href="#">← Anime studio</a>
  <div class="title-row">
    <h1>Style directions</h1>
    <div class="tabs" id="tabs"></div>
  </div>
  <p class="guide">Each sheet shows six moments from the same video: the greeting, a statement, a list, a file on screen, a title and the five steps. Pick a number. The next round branches 10 variations from it.</p>
  <p class="parent" id="parent"></p>
  <div class="grid" id="grid"></div>
</main>
<div class="box" id="box"><p id="boxlabel"></p><img id="boximg" alt=""></div>
<script>
(async () => {
  const video = new URLSearchParams(location.search).get('video') || 'hello-aoi';
  const data = await (await fetch(`/kit/styles/gallery/rounds.json?${Date.now()}`)).json();
  const rounds = data.rounds;
  const tabs = document.getElementById('tabs'), grid = document.getElementById('grid'), parent = document.getElementById('parent');
  const box = document.getElementById('box'), boximg = document.getElementById('boximg'), boxlabel = document.getElementById('boxlabel');
  let current = [], shown = -1;
  const open = (i) => { shown = i; const s = current[i]; boximg.src = s.img; boxlabel.textContent = `${s.num}. ${s.name}  ·  arrows to move, Esc to close`; box.classList.add('on'); };
  box.onclick = () => { box.classList.remove('on'); shown = -1; };
  addEventListener('keydown', (e) => {
    if (shown < 0) return;
    if (e.key === 'Escape') box.click();
    if (e.key === 'ArrowRight') open((shown + 1) % current.length);
    if (e.key === 'ArrowLeft') open((shown - 1 + current.length) % current.length);
  });
  function show(n) {
    const r = rounds.find((x) => x.n === n);
    [...tabs.children].forEach((b) => b.setAttribute('aria-pressed', +b.dataset.n === n));
    const p = r.parent && rounds.flatMap((x) => x.styles).find((s) => s.id === r.parent);
    parent.textContent = r.parent ? `Branched from ${p ? p.name : r.parent}.` : '';
    current = r.styles.map((s) => ({ ...s, img: `/kit/styles/gallery/r${r.n}/${s.id}.jpg?${Date.now()}` }));
    grid.innerHTML = '';
    current.forEach((s, i) => {
      const live = `/kit/player/player.html?video=${video}&style=${s.id}`;
      const el = document.createElement('article');
      el.className = 'card';
      el.innerHTML = `<img alt="" loading="lazy"><div class="body"><div class="head"><span class="num"></span><h2></h2></div>
        <p class="blurb"></p>${s.errors && s.errors.length ? '<p class="err">This style had errors on the page.</p>' : ''}
        <div class="actions"><a class="primary" target="_blank">Play live</a><a target="_blank">日本語</a></div></div>`;
      el.querySelector('img').src = s.img; el.querySelector('img').onclick = () => open(i);
      el.querySelector('.num').textContent = s.num; el.querySelector('h2').textContent = s.name; el.querySelector('.blurb').textContent = s.blurb;
      const [a1, a2] = el.querySelectorAll('.actions a'); a1.href = live; a2.href = `${live}&lang=ja`;
      grid.appendChild(el);
    });
  }
  rounds.forEach((r) => {
    const b = document.createElement('button'); b.dataset.n = r.n; b.textContent = `Round ${r.n}`; b.onclick = () => show(r.n); tabs.appendChild(b);
  });
  show(rounds[rounds.length - 1].n);
})();
</script>
</body>
</html>
