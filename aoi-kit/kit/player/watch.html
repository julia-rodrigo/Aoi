<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch</title>
<style>
  @font-face { font-family: 'Instrument Serif'; src: url('/kit/fonts/InstrumentSerif-Regular.ttf'); }
  @font-face { font-family: 'Instrument Sans'; src: url('/kit/fonts/InstrumentSans.ttf'); font-weight: 400 700; }
  :root {
    --bg: #ffffff; --bg2: #f7f7f4; --fg: #141414; --muted: #6e6e66; --border: #e4e4df; --sep: #ecece7;
    --accent: #5d7740; --accent-hover: #51693a; --on-accent: #ffffff; --soft: #eef2e6; --on-soft: #3f5229;
    --card: #ffffff; --page: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111210; --bg2: #1a1b17; --fg: #eceae2; --muted: #97978d; --border: rgba(255,255,255,.09); --sep: rgba(255,255,255,.07);
      --accent: #8fa866; --accent-hover: #9db574; --on-accent: #10110e; --soft: rgba(143,168,102,.15); --on-soft: #b9cc95;
      --card: #1f201c; --page: radial-gradient(ellipse 85% 65% at 50% -12%, #2a2b25 0%, #1a1b17 48%, #111210 100%);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--page); background-color: var(--bg); color: var(--fg); font: 400 0.9375rem/1.5 'Instrument Sans', system-ui, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 24px 48px; }
  .back { color: var(--muted); font-size: .8125rem; text-decoration: none; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  h1 { font: 400 2.8rem/1.05 'Instrument Serif', serif; letter-spacing: -.01em; margin: 0; }
  .guide { color: var(--muted); margin: 10px 0 24px; max-width: 640px; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--bg2); box-shadow: inset 0 0 0 1px var(--border); }
  .seg button { font: 500 .875rem 'Instrument Sans', sans-serif; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; background: transparent; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--border); }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
  .stage video.on { opacity: 1; }
  .bar { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .play { font: 500 .875rem 'Instrument Sans', sans-serif; border: 0; border-radius: 999px; padding: 8px 20px; cursor: pointer; background: var(--accent); color: var(--on-accent); min-width: 84px; }
  .play:hover { background: var(--accent-hover); }
  .track { flex: 1; height: 6px; border-radius: 999px; background: var(--sep); position: relative; cursor: pointer; }
  .fill { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--accent); }
  .time { color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
  .meta { color: var(--muted); font-size: .8125rem; margin-top: 12px; }
  kbd { font: 500 .75rem 'Instrument Sans', sans-serif; padding: 1px 7px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--border); }
  @media (max-width: 600px) { h1 { font-size: 2.25rem; } main { padding: 20px 16px 32px; } }
</style>
</head>
<body>
<main>
  <a class="back" href="#">← Anime studio</a>
  <div class="title-row">
    <h1 id="title">Watch</h1>
    <div class="seg" id="langs"></div>
  </div>
  <p class="guide">Both voices play at the same time on one timeline, with English text and English subtitles. Switch at any second: the voice and her lips change in place, with no jump.</p>
  <div class="stage" id="stage"></div>
  <div class="bar">
    <button class="play" id="play">Play</button>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
  <p class="meta"><kbd>Space</kbd> play or pause · <kbd>L</kbd> switch language · <kbd>←</kbd> <kbd>→</kbd> 5 seconds</p>
</main>
<script>
(async () => {
  const video = new URLSearchParams(location.search).get('video');
  const bundle = await (await fetch(`/videos/${video}/bundle.json`)).json();
  document.getElementById('title').textContent = bundle.title || video;
  document.title = bundle.title || video;
  const names = { en: 'English voice', ja: 'Japanese voice' };
  const langs = [];
  for (const l of (bundle.lang_order || ['en']).filter((x) => !(bundle.langs[x] || {}).textOnly)) {
    const src = `/videos/${video}/render/${video}.${l}.mp4`;
    if ((await fetch(src, { method: 'HEAD' })).ok) langs.push({ l, src });
  }
  const stage = document.getElementById('stage'), seg = document.getElementById('langs');
  const vids = langs.map(({ l, src }) => {
    const v = document.createElement('video');
    v.src = src; v.preload = 'auto'; v.playsInline = true; v.muted = true;
    stage.appendChild(v);
    const b = document.createElement('button');
    b.textContent = names[l] || l; b.onclick = () => use(l);
    seg.appendChild(b);
    return { l, v, b };
  });
  let cur = vids.find((x) => x.l === new URLSearchParams(location.search).get('voice')) || vids[0];
  const ts = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  // every file has the same length and the same frame for every beat, so a swap is a change of which one you see and hear
  function use(l) {
    const next = vids.find((x) => x.l === l) || cur;
    if (Math.abs(next.v.currentTime - cur.v.currentTime) > .03) next.v.currentTime = cur.v.currentTime;
    for (const x of vids) { x.v.classList.toggle('on', x === next); x.v.muted = x !== next; x.b.setAttribute('aria-pressed', x === next); }
    cur = next;
  }
  use(cur.l);
  const playBtn = document.getElementById('play');
  const toggle = () => {
    if (cur.v.paused) { vids.forEach((x) => { x.v.currentTime = cur.v.currentTime; x.v.play(); }); playBtn.textContent = 'Pause'; }
    else { vids.forEach((x) => x.v.pause()); playBtn.textContent = 'Play'; }
  };
  const seek = (t) => vids.forEach((x) => { x.v.currentTime = Math.max(0, Math.min(t, x.v.duration || t)); });
  playBtn.onclick = toggle;
  document.getElementById('track').onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * cur.v.duration); };
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    if (e.code === 'KeyL') use(vids[(vids.indexOf(cur) + 1) % vids.length].l);
    if (e.code === 'ArrowRight') seek(cur.v.currentTime + 5);
    if (e.code === 'ArrowLeft') seek(cur.v.currentTime - 5);
  });
  cur.v.addEventListener('ended', () => { playBtn.textContent = 'Play'; });
  // keep the hidden files on the same frame as the one you watch
  const tick = () => {
    const t = cur.v.currentTime, d = cur.v.duration || 0;
    for (const x of vids) if (x !== cur && !cur.v.paused && Math.abs(x.v.currentTime - t) > .06) x.v.currentTime = t;
    document.getElementById('fill').style.width = d ? `${t / d * 100}%` : 0;
    document.getElementById('time').textContent = `${ts(t)} / ${ts(d)}`;
    requestAnimationFrame(tick);
  };
  tick();
})();
</script>
</body>
</html>
