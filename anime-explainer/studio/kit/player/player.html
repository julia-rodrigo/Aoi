<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studio player</title>
<style>
  @font-face { font-family: 'Rounded'; src: url('/kit/fonts/MPLUSRounded1c-ExtraBold.ttf'); font-weight: 800; }
  @font-face { font-family: 'RoundedM'; src: url('/kit/fonts/MPLUSRounded1c-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Pixel'; src: url('/kit/fonts/Silkscreen-Regular.ttf'); }
  @font-face { font-family: 'PixelJA'; src: url('/kit/fonts/DotGothic16-Regular.ttf'); }
  @font-face { font-family: 'Mono'; src: url('/kit/fonts/JetBrainsMonoNerdFontMono-Regular.ttf'); }
  @font-face { font-family: 'MonoB'; src: url('/kit/fonts/JetBrainsMonoNerdFontMono-Bold.ttf'); }
  html, body { margin: 0; background: #0f1220; color: #e8ecf6; font: 14px/1.4 -apple-system, system-ui, sans-serif; }
  body.render { background: transparent; overflow: hidden; }
  #wrap { max-width: 1600px; margin: 0 auto; padding: 16px; }
  body.render #wrap { padding: 0; max-width: none; }
  canvas { display: block; width: 100%; aspect-ratio: 16 / 9; background: #fff; border-radius: 8px; }
  body.render canvas { width: 1920px; height: 1080px; border-radius: 0; }
  #bar { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  body.render #bar, body.render #info { display: none; }
  body.layer canvas { background: transparent; }
  body.embed { background: #000; overflow: hidden; }
  body.embed #wrap { padding: 0; max-width: none; }
  body.embed canvas { border-radius: 0; width: 100vw; height: 100vh; aspect-ratio: auto; }
  body.embed #bar, body.embed #info { display: none; }
  button { background: #2f5bff; color: #fff; border: 0; border-radius: 999px; padding: 8px 18px; font-weight: 600; cursor: pointer; }
  #scrub { flex: 1; position: relative; height: 28px; background: #1c2135; border-radius: 999px; cursor: pointer; overflow: hidden; }
  #fill { position: absolute; inset: 0 auto 0 0; background: #2f5bff55; }
  .tick { position: absolute; top: 0; bottom: 0; width: 2px; background: #6f8cff; opacity: .6; }
  .tick.sec { background: #2fd3ff; width: 3px; opacity: 1; }
  #time { font-variant-numeric: tabular-nums; min-width: 120px; }
  #info { margin-top: 10px; color: #97a0bd; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="bar"><button id="play">Play</button><div id="scrub"><div id="fill"></div></div><span id="time">0:00</span></div>
  <div id="info">Space: play or pause. L: voice language. S: subtitles (EN, JA, off). T: on-screen text language. Arrows: 2 seconds, or last and next beat.</div>
</div>
<script src="/kit/player/kit.js"></script>
</body>
</html>
